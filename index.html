<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Urologiya testlari</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Urologiya <span>testlari</span></div>
  <button id="langBtn" class="ghost small" type="button" aria-label="Til / Язык">RU</button>
</header>

<main id="app">
  <!-- START SCREEN -->
  <section id="start" class="card screen">
    <h1 data-t="title"></h1>
    <p class="muted" id="totalInfo"></p>

    <label class="field">
      <span data-t="count"></span>
      <div class="chips" id="countChips"></div>
    </label>

    <label class="field">
      <span data-t="range"></span>
      <div class="range-row">
        <input type="number" id="rangeFrom" min="1" inputmode="numeric">
        <span>—</span>
        <input type="number" id="rangeTo" min="1" inputmode="numeric">
      </div>
    </label>

    <label class="check"><input type="checkbox" id="optShuffleQ" checked> <span data-t="shuffleQ"></span></label>
    <label class="check"><input type="checkbox" id="optShuffleA" checked> <span data-t="shuffleA"></span></label>
    <label class="check"><input type="checkbox" id="optInstant" checked> <span data-t="instant"></span></label>

    <button id="startBtn" class="primary big" type="button" data-t="start"></button>
    <button id="resumeBtn" class="ghost big hidden" type="button" data-t="resume"></button>
    <button id="mistakesBtn" class="ghost big hidden" type="button"></button>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="quiz" class="screen hidden">
    <div class="progress-wrap">
      <div class="progress-text"><span id="qNum"></span><span id="score"></span></div>
      <div class="bar"><div id="barFill"></div></div>
    </div>
    <div class="card">
      <div class="qmeta"><span id="qOrig"></span><span id="qHint"></span></div>
      <h2 id="qText"></h2>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback hidden"></div>
    </div>
    <div class="nav">
      <button id="prevBtn" class="ghost" type="button" data-t="prev"></button>
      <button id="checkBtn" class="primary" type="button" data-t="check"></button>
      <button id="nextBtn" class="primary hidden" type="button" data-t="next"></button>
    </div>
    <div class="nav secondary">
      <button id="gridBtn" class="ghost small" type="button" data-t="all"></button>
      <button id="finishBtn" class="ghost small danger" type="button" data-t="finish"></button>
    </div>
    <div id="grid" class="grid hidden"></div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="result" class="screen hidden">
    <div class="card center">
      <h1 data-t="result"></h1>
      <div class="big-score" id="resPercent"></div>
      <p id="resText" class="muted"></p>
      <div class="res-actions">
        <button id="reviewBtn" class="primary big" type="button" data-t="reviewWrong"></button>
        <button id="retryWrongBtn" class="ghost big" type="button" data-t="retryWrong"></button>
        <button id="homeBtn" class="ghost big" type="button" data-t="home"></button>
      </div>
    </div>
    <div id="review"></div>
  </section>
</main>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
